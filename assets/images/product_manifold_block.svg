<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="block-steel" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="blue-handle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c75bc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="red-handle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="green-handle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="block-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="160" cy="214" rx="115" ry="14" fill="#e2e8f0"/>

  <g filter="url(#block-shadow)">
    <!-- 3D Precision Machined Manifold Block -->
    <!-- Top Face -->
    <polygon points="50,110 85,90 270,90 235,110" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <!-- Front Face -->
    <polygon points="50,110 235,110 235,185 50,185" fill="url(#block-steel)" stroke="#475569" stroke-width="2"/>
    <!-- Right Face -->
    <polygon points="235,110 270,90 270,165 235,185" fill="#64748b" stroke="#334155" stroke-width="2"/>

    <!-- Process Bores on Front Face -->
    <circle cx="85" cy="148" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="85" cy="148" r="8" fill="#0f172a"/>
    <circle cx="142" cy="148" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="142" cy="148" r="8" fill="#0f172a"/>
    <circle cx="200" cy="148" r="14" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="200" cy="148" r="8" fill="#0f172a"/>

    <!-- Transmitter Flange Mounting Holes (IEC 61518) -->
    <circle cx="85" cy="122" r="4.5" fill="#1e293b"/>
    <circle cx="200" cy="122" r="4.5" fill="#1e293b"/>
    <circle cx="85" cy="174" r="4.5" fill="#1e293b"/>
    <circle cx="200" cy="174" r="4.5" fill="#1e293b"/>

    <!-- 3 Needle Bonnets Rising from Top Face -->
    <!-- Left Valve (Isolate - Blue Handle) -->
    <rect x="85" y="60" width="12" height="32" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
    <rect x="60" y="52" width="62" height="10" rx="4" fill="url(#blue-handle)" stroke="#0f172a" stroke-width="1"/>
    <circle cx="91" cy="57" r="3" fill="#ffffff"/>

    <!-- Center Valve (Equalize - Green Handle) -->
    <rect x="155" y="42" width="12" height="50" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
    <rect x="130" y="34" width="62" height="10" rx="4" fill="url(#green-handle)" stroke="#0f172a" stroke-width="1"/>
    <circle cx="161" cy="39" r="3" fill="#ffffff"/>

    <!-- Right Valve (Vent - Red Handle) -->
    <rect x="225" y="60" width="12" height="32" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
    <rect x="200" y="52" width="62" height="10" rx="4" fill="url(#red-handle)" stroke="#0f172a" stroke-width="1"/>
    <circle cx="231" cy="57" r="3" fill="#ffffff"/>
  </g>
</svg>
