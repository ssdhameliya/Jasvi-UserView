<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="check-metal" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="check-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="205" rx="100" ry="12" fill="#e2e8f0"/>

  <g filter="url(#check-shadow)">
    <!-- High-Pressure Check Valve (Unidirectional In-Line Hex Body) -->
    <!-- Left Ferrule Nut -->
    <rect x="45" y="115" width="35" height="50" rx="3" fill="url(#check-metal)" stroke="#334155" stroke-width="2"/>
    <line x1="56" y1="115" x2="56" y2="165" stroke="#94a3b8" stroke-width="2"/>
    <line x1="68" y1="115" x2="68" y2="165" stroke="#94a3b8" stroke-width="2"/>

    <!-- Left Tube Stub -->
    <rect x="80" y="123" width="25" height="34" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>

    <!-- Main Valve Hex Body -->
    <polygon points="105,100 215,100 230,120 230,160 215,180 105,180 90,160 90,120" fill="url(#check-metal)" stroke="#334155" stroke-width="2.5"/>
    <line x1="105,100" y1="105,180" x2="215,100" y2="215,180" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Right Tube Stub -->
    <rect x="215" y="123" width="25" height="34" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>

    <!-- Right Ferrule Nut -->
    <rect x="240" y="115" width="35" height="50" rx="3" fill="url(#check-metal)" stroke="#334155" stroke-width="2"/>
    <line x1="252" y1="115" x2="252" y2="165" stroke="#94a3b8" stroke-width="2"/>
    <line x1="264" y1="115" x2="264" y2="165" stroke="#94a3b8" stroke-width="2"/>

    <!-- Flow Arrow & Pressure Indicator Engraving on Body -->
    <rect x="125" y="132" width="70" height="16" rx="3" fill="#1c75bc"/>
    <path d="M 135,140 L 175,140 M 168,135 L 177,140 L 168,145" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Specs Stamping Text Representation -->
    <text x="160" y="165" font-family="sans-serif" font-size="7" font-weight="bold" fill="#334155" text-anchor="middle" letter-spacing="1">6,000 PSI • SS316</text>
  </g>
</svg>
