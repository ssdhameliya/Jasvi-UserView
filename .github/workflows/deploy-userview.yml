name: Deploy UserView Showcase

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'showcase-v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Select deployment scope (UAT is always deployed 1st)'
        required: true
        default: 'uat-only'
        type: choice
        options:
          - 'uat-only'
          - 'uat-then-prod'

permissions:
  contents: read

concurrency:
  group: dse-userview-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-uat:
    name: 1. Deploy to UAT Testing Environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Authentication & Speed Optimizer
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DSE_UAT_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DSE_UAT_SSH_HOST }} >> ~/.ssh/known_hosts
          cat << 'EOF' > ~/.ssh/config
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 3
            Compression yes
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 120s
            StrictHostKeyChecking accept-new
          EOF

      - name: Upload UserView Assets to UAT
        run: |
          tar -czf /tmp/userview_uat.tar.gz --exclude='.git' --exclude='.github' .
          scp /tmp/userview_uat.tar.gz ${{ secrets.DSE_UAT_SSH_USER }}@${{ secrets.DSE_UAT_SSH_HOST }}:/tmp/userview_uat.tar.gz
          
          ssh ${{ secrets.DSE_UAT_SSH_USER }}@${{ secrets.DSE_UAT_SSH_HOST }} '
            sudo mkdir -p /srv/dse-erp/web/public &&
            sudo rm -rf /srv/dse-erp/web/public/* &&
            sudo tar -xzf /tmp/userview_uat.tar.gz --no-same-owner -C /srv/dse-erp/web/public/ &&
            sudo chmod -R a+rX /srv/dse-erp/web/public &&
            if command -v chcon >/dev/null 2>&1; then
              sudo chcon -R -t httpd_sys_content_t /srv/dse-erp/web/public 2>/dev/null || true
            fi
            rm -f /tmp/userview_uat.tar.gz
          '

      - name: Verify Live UAT Endpoint
        run: |
          RESP=$(curl --fail --silent --show-error --max-time 20 "https://web-uat.jasviindustries.in")
          [[ "$RESP" == *"Jasvi Industries"* ]] || { echo "UAT verification failed: 'Jasvi Industries' not found" >&2; exit 1; }
          echo "UAT Showcase verified and LIVE at https://web-uat.jasviindustries.in"

  deploy-prod:
    name: 2. Deploy to Production Environment (After UAT)
    needs: deploy-uat
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'uat-then-prod')
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup SSH Authentication & Speed Optimizer
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DSE_PROD_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DSE_PROD_SSH_HOST }} >> ~/.ssh/known_hosts
          cat << 'EOF' > ~/.ssh/config
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 3
            Compression yes
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 120s
            StrictHostKeyChecking accept-new
          EOF

      - name: Upload UserView Assets to PROD
        run: |
          tar -czf /tmp/userview_prod.tar.gz --exclude='.git' --exclude='.github' .
          scp /tmp/userview_prod.tar.gz ${{ secrets.DSE_PROD_SSH_USER }}@${{ secrets.DSE_PROD_SSH_HOST }}:/tmp/userview_prod.tar.gz
          
          ssh ${{ secrets.DSE_PROD_SSH_USER }}@${{ secrets.DSE_PROD_SSH_HOST }} '
            sudo mkdir -p /srv/dse-erp/web/public &&
            sudo rm -rf /srv/dse-erp/web/public/* &&
            sudo tar -xzf /tmp/userview_prod.tar.gz --no-same-owner -C /srv/dse-erp/web/public/ &&
            sudo chmod -R a+rX /srv/dse-erp/web/public &&
            if command -v chcon >/dev/null 2>&1; then
              sudo chcon -R -t httpd_sys_content_t /srv/dse-erp/web/public 2>/dev/null || true
            fi
            rm -f /tmp/userview_prod.tar.gz
          '

      - name: Verify Live PROD Endpoints
        run: |
          RESP_ROOT=$(curl --fail --silent --show-error --max-time 20 "https://jasviindustries.in")
          [[ "$RESP_ROOT" == *"Jasvi Industries"* ]] || { echo "PROD root verification failed: 'Jasvi Industries' not found" >&2; exit 1; }
          RESP_WWW=$(curl --fail --silent --show-error --max-time 20 "https://www.jasviindustries.in")
          [[ "$RESP_WWW" == *"Jasvi Industries"* ]] || { echo "PROD www verification failed: 'Jasvi Industries' not found" >&2; exit 1; }
          echo "PROD Showcase verified and LIVE at https://jasviindustries.in and https://www.jasviindustries.in"
